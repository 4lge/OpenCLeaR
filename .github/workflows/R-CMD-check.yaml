name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_REREMOTES: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies (OpenCL & POCL CPU Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Setup r-lib Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytest
            any::Rcpp
            any::rmarkdown
            any::ggplot2
            any::gridExtra

      - name: Check Package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: '--no-manual --as-cran'
          error-on: '"error"'

