name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_REREMOTES: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies (OpenCL & POCL CPU Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Setup r-lib Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytest
            any::Rcpp
            any::rmarkdown
            any::ggplot2
            any::gridExtra
            any::roxygen2

      - name: Generate NAMESPACE and Rd Documentation via Makefile
        run: |
          # 1. Dokumentation und Exporte aufbauen
          touch NAMESPACE.in
          make NAMESPACE
          make RdFiles
          make src/RcppExports.cpp
          
          # 2. Den lokalen CMake-Cache radikal wegräumen, damit R CMD build jungfräulich startet
          # Falls 'make dist-clean' in deinem Makefile definiert ist:
          make dist-clean || true
          
          # Zur absoluten Sicherheit löschen wir auch manuell das build-Verzeichnis
          rm -rf src/backend/build/
          rm -f src/backend/CMakeCache.txt

      - name: Check Package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

      - name: Show tinytest Output Log
        if: always()  # Läuft garantiert immer, egal ob der Check erfolgreich war oder fehlgeschlagen ist!
        run: |
          echo "=== SEARCHING FOR TINYTEST LOGS ==="
          # Sucht die tinytest.Rout im generierten Check-Verzeichnis und gibt sie aus
          find ${{ github.workspace }}/check -name "tinytest.Rout" -exec echo "--- File: {} ---" \; -exec cat {} \; || true
