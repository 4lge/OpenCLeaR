name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_REREMOTES: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_VIGNETTES_NLANG_: "TRUE" # Verhindert, dass der Runner versucht, die Vignetten während des Checks neu zu rendern

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies (OpenCL & POCL CPU Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Setup r-lib Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytest
            any::Rcpp
            any::rmarkdown
            any::ggplot2
            any::gridExtra
            any::roxygen2

      - name: Generate NAMESPACE and Rd Documentation via Makefile
        run: |
          # 1. Dokumentation, Exporte und RcppSchnittstellen frisch aufbauen
          touch NAMESPACE.in
          make NAMESPACE
          make RdFiles
          make src/RcppExports.cpp
          
          # 2. Lokalen CMake-Cache restlos entfernen für sauberen R CMD build Lauf
          make dist-clean || true
          rm -rf src/backend/build/
          rm -f src/backend/CMakeCache.txt

      - name: Check Package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")' # Erzwingt das Überspringen des Vignetten-Baus im Check
          error-on: '"error"'

